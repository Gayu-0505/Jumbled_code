<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rabbit Coders — Jumbled Code Challenge</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --purple: #7c3aed; --purple-light: #a78bfa; --pink: #ec4899;
            --yellow: #facc15; --green: #22c55e; --red: #ef4444;
            --orange: #f97316; --cyan: #06b6d4; --blue: #3b82f6;
            --bg: #faf5ff; --card-bg: #ffffff; --text: #1e1b4b;
            --text-muted: #6b7280; --border: #e9d5ff;
        }

        body {
            font-family: 'Nunito', 'Segoe UI', sans-serif;
            background: var(--bg);
            background-image:
                radial-gradient(circle at 15% 20%, rgba(124,58,237,.08) 0%, transparent 50%),
                radial-gradient(circle at 85% 80%, rgba(236,72,153,.08) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(250,204,21,.06) 0%, transparent 60%);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Floating shapes background */
        body::before, body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            z-index: 0;
            pointer-events: none;
            opacity: .12;
        }
        body::before {
            width: 300px; height: 300px;
            background: var(--yellow);
            top: -60px; right: -40px;
            border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%;
            animation: morphBlob 12s ease-in-out infinite;
        }
        body::after {
            width: 250px; height: 250px;
            background: var(--pink);
            bottom: -40px; left: -30px;
            border-radius: 70% 30% 30% 70% / 70% 70% 30% 30%;
            animation: morphBlob 15s ease-in-out infinite reverse;
        }
        @keyframes morphBlob {
            0%, 100% { border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%; transform: rotate(0deg) scale(1); }
            33% { border-radius: 70% 30% 30% 70% / 70% 70% 30% 30%; transform: rotate(120deg) scale(1.1); }
            66% { border-radius: 50% 50% 30% 70% / 50% 70% 30% 50%; transform: rotate(240deg) scale(.95); }
        }

        /* Confetti dots */
        .confetti-bg {
            position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
        }
        .confetti-bg span {
            position: absolute;
            width: 8px; height: 8px;
            border-radius: 50%;
            opacity: .18;
            animation: confettiFall linear infinite;
        }
        @keyframes confettiFall {
            0% { transform: translateY(-10px) rotate(0deg); opacity: .18; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }
        @keyframes pulse {
            0%, 100% { opacity: .6; }
            50% { opacity: 1; }
        }

        /* Header bar */
        .header {
            position: sticky; top: 0; z-index: 10;
            background: rgba(255,255,255,.92);
            backdrop-filter: blur(16px);
            border-bottom: 3px solid var(--border);
            padding: 14px 24px;
            display: flex; align-items: center; justify-content: center;
            gap: 16px;
        }
        .header h1 {
            font-size: 1.4rem; font-weight: 900;
            background: linear-gradient(135deg, var(--purple), var(--pink), var(--orange));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -.01em;
        }
        .header .logo-icon { font-size: 1.6rem; margin-right: 8px; }
        .header-left { display: flex; align-items: center; }

        /* Main container */
        .container {
            position: relative; z-index: 1;
            max-width: 640px;
            width: 100%;
            margin: 0 auto;
            padding: 0 16px;
        }

        /* Card */
        .card {
            background: var(--card-bg);
            border: 2px solid var(--border);
            border-radius: 24px;
            padding: 40px 36px;
            box-shadow: 0 4px 24px rgba(124,58,237,.08), 0 1px 4px rgba(0,0,0,.04);
            animation: popIn .4s cubic-bezier(.34,1.56,.64,1);
            text-align: center;
        }
        @keyframes popIn {
            from { opacity: 0; transform: scale(.95) translateY(12px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        h2 { font-size: 1.4rem; font-weight: 800; margin-bottom: 1rem; color: var(--text); }
        p { margin-bottom: .75rem; color: var(--text-muted); line-height: 1.7; font-size: .95rem; }

        .hidden { display: none; }

        /* Inputs */
        input[type="text"] {
            width: 100%;
            padding: 14px 18px;
            background: #faf5ff;
            border: 2px solid var(--border);
            border-radius: 14px;
            font-size: 1rem; color: var(--text);
            font-family: 'Nunito', sans-serif;
            font-weight: 600;
            transition: border-color .2s, box-shadow .2s;
            text-align: center;
        }
        input[type="text"]::placeholder { color: #a78bfa; font-weight: 500; }
        input[type="text"]:focus {
            outline: none;
            border-color: var(--purple);
            box-shadow: 0 0 0 4px rgba(124,58,237,.12);
        }

        /* Buttons */
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            background: linear-gradient(135deg, var(--purple), var(--pink));
            color: #fff; border: none; border-radius: 16px;
            padding: 14px 32px; font-size: 1rem; font-weight: 700;
            cursor: pointer; font-family: 'Nunito', sans-serif;
            transition: transform .2s, box-shadow .2s;
            margin-top: 12px;
            letter-spacing: .01em;
        }
        .btn:hover { transform: translateY(-3px) scale(1.02); box-shadow: 0 8px 28px rgba(124,58,237,.25); }
        .btn:active { transform: translateY(0) scale(.98); }
        .btn:disabled { background: #e5e7eb; color: #9ca3af; cursor: not-allowed; transform: none; box-shadow: none; }
        .btn-secondary { background: #f3e8ff; color: var(--purple); }
        .btn-secondary:hover { background: #ede9fe; color: var(--purple); box-shadow: 0 4px 16px rgba(124,58,237,.12); }
        .btn-success { background: linear-gradient(135deg, var(--green), #16a34a); }

        /* Code blocks */
        .code-block {
            background: #faf5ff;
            border: 2px solid var(--border);
            border-left: 5px solid var(--purple);
            border-radius: 14px;
            padding: 14px 18px;
            font-family: 'JetBrains Mono', 'Consolas', monospace;
            font-size: .88rem; color: var(--text);
            margin: 8px 0;
            cursor: pointer;
            transition: all .2s ease;
            user-select: none;
            text-align: left;
        }
        .code-block:hover {
            background: #ede9fe;
            border-left-color: var(--pink);
            transform: translateX(6px);
            box-shadow: 0 4px 12px rgba(124,58,237,.1);
        }
        .code-block.selected {
            background: #dcfce7;
            border-left-color: var(--green);
            border-color: #bbf7d0;
            opacity: .55;
            transform: none;
        }

        /* Feedback */
        .error { color: var(--red); font-size: .9rem; margin-top: 8px; font-weight: 700; }
        .success { color: var(--green); font-size: .9rem; margin-top: 8px; font-weight: 700; }

        /* Progress bar */
        .progress-bar {
            width: 100%; height: 10px;
            background: #f3e8ff;
            border-radius: 10px; margin: 20px 0; overflow: hidden;
            border: 1px solid var(--border);
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--purple), var(--pink), var(--orange));
            border-radius: 10px;
            transition: width .5s cubic-bezier(.4,0,.2,1);
        }

        /* Badges */
        .badge {
            display: inline-flex; align-items: center; gap: 4px;
            background: #ede9fe;
            color: var(--purple);
            padding: 6px 16px; border-radius: 20px;
            font-size: .8rem; font-weight: 700;
            margin-right: 6px; margin-bottom: 8px;
            border: 2px solid var(--border);
        }
        .badge-purple { background: #fce7f3; color: var(--pink); border-color: #fbcfe8; }
        .badge-green { background: #dcfce7; color: #16a34a; border-color: #bbf7d0; }

        /* Question card */
        .question-card {
            background: linear-gradient(135deg, #faf5ff, #fce7f3);
            border: 2px solid var(--border);
            border-radius: 18px;
            padding: 28px; margin-top: 20px;
        }
        .question-card .q-label {
            font-size: .78rem; font-weight: 800;
            text-transform: uppercase; letter-spacing: .08em;
            color: var(--pink); margin-bottom: 12px;
        }
        .question-card .q-text {
            font-size: 1.15rem; font-weight: 700;
            color: var(--text); margin-bottom: 18px; line-height: 1.5;
        }

        /* Arrange area */
        .arrange-drop {
            min-height: 70px;
            border: 3px dashed #d8b4fe;
            border-radius: 18px;
            padding: 10px;
            margin: 12px 0;
            background: #faf5ff;
            transition: border-color .2s, background .2s;
        }
        .arrange-drop:has(.code-block) { border-color: #86efac; background: #f0fdf4; }

        /* Timer display */
        .timer {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.1rem; color: var(--purple); font-weight: 700;
        }

        /* Leaderboard table */
        .leaderboard-table { width: 100%; border-collapse: collapse; margin-top: 16px; }
        .leaderboard-table th {
            background: #ede9fe;
            color: var(--purple);
            font-size: .78rem; text-transform: uppercase; letter-spacing: .06em;
            padding: 12px 14px; text-align: center;
            border-bottom: 2px solid var(--border);
        }
        .leaderboard-table td {
            padding: 12px 14px;
            border-bottom: 1px solid #f3e8ff;
            font-size: .9rem; color: var(--text);
            text-align: center;
        }
        .leaderboard-table tr:hover td { background: #faf5ff; }
        .rank-1 { color: var(--orange); font-weight: 800; }
        .rank-2 { color: var(--text-muted); font-weight: 800; }
        .rank-3 { color: #cd7f32; font-weight: 800; }

        /* Celebration */
        .celebrate { text-align: center; }
        .celebrate .big-icon {
            font-size: 4rem; margin-bottom: 16px; display: block;
            animation: bounce 1s ease infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        /* Section label */
        .section-label {
            font-size: .75rem; font-weight: 800;
            text-transform: uppercase; letter-spacing: .1em;
            color: var(--purple-light); margin: 20px 0 10px;
        }

        /* Responsive */
        @media (max-width: 500px) {
            .container { padding: 0 10px; margin: 16px auto; }
            .card { padding: 24px 18px; border-radius: 20px; }
            .header h1 { font-size: 1.1rem; }
        }
    </style>
</head>
<body>
    <div class="confetti-bg" id="confetti-bg"></div>
    <div class="container">
        <div class="card" id="app"></div>
    </div>
    <script>
        // Generate confetti dots
        (function() {
            const bg = document.getElementById('confetti-bg');
            const colors = ['#7c3aed','#ec4899','#facc15','#22c55e','#f97316','#06b6d4'];
            for (let i = 0; i < 30; i++) {
                const s = document.createElement('span');
                s.style.left = Math.random() * 100 + '%';
                s.style.background = colors[Math.floor(Math.random() * colors.length)];
                s.style.width = s.style.height = (4 + Math.random() * 8) + 'px';
                s.style.animationDuration = (8 + Math.random() * 12) + 's';
                s.style.animationDelay = (Math.random() * 10) + 's';
                bg.appendChild(s);
            }
        })();
    </script>
    <script src="/config.js"></script>
    <script src="js/core.js"></script>
</body>
</html>
