<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jumbled Code Challenge</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --sky: #0ea5e9; --purple: #8b5cf6; --emerald: #10b981;
            --red: #ef4444; --amber: #f59e0b; --slate-50: #f8fafc;
            --slate-100: #f1f5f9; --slate-200: #e2e8f0; --slate-400: #94a3b8;
            --slate-500: #64748b; --slate-700: #334155; --slate-900: #0f172a;
        }

        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            color: #e2e8f0;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Animated background blobs */
        body::before, body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            opacity: .15;
            z-index: 0;
            pointer-events: none;
        }
        body::before {
            width: 600px; height: 600px;
            background: var(--sky);
            top: -120px; left: -100px;
            animation: float 18s ease-in-out infinite;
        }
        body::after {
            width: 500px; height: 500px;
            background: var(--purple);
            bottom: -80px; right: -60px;
            animation: float 22s ease-in-out infinite reverse;
        }
        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(60px, -40px) scale(1.05); }
            66% { transform: translate(-30px, 30px) scale(.97); }
        }

        /* Header bar */
        .header {
            position: sticky; top: 0; z-index: 10;
            background: rgba(15, 23, 42, .85);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255,255,255,.06);
            padding: 16px 24px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .header h1 {
            font-size: 1.3rem; font-weight: 800;
            background: linear-gradient(135deg, var(--sky), var(--purple));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -.02em;
        }
        .header .logo-icon { font-size: 1.5rem; margin-right: 10px; }
        .header-left { display: flex; align-items: center; }
        #live-timer {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1rem; font-weight: 600;
            color: var(--purple);
            background: rgba(139,92,246,.1);
            padding: 6px 14px; border-radius: 8px;
            border: 1px solid rgba(139,92,246,.2);
            display: none;
        }

        /* Main container */
        .container {
            position: relative; z-index: 1;
            max-width: 680px;
            margin: 32px auto;
            padding: 0 16px;
        }

        /* Card */
        .card {
            background: rgba(30, 41, 59, .7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,.06);
            border-radius: 20px;
            padding: 36px 32px;
            box-shadow: 0 8px 32px rgba(0,0,0,.25);
            animation: fadeUp .4s ease;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h2 { font-size: 1.35rem; font-weight: 700; margin-bottom: 1rem; color: #f1f5f9; }
        p { margin-bottom: .75rem; color: var(--slate-400); line-height: 1.7; font-size: .95rem; }

        .hidden { display: none; }

        /* Inputs */
        input[type="text"] {
            width: 100%;
            padding: 14px 18px;
            background: rgba(15,23,42,.6);
            border: 2px solid rgba(255,255,255,.08);
            border-radius: 12px;
            font-size: 1rem; color: #f1f5f9;
            font-family: 'Inter', sans-serif;
            transition: border-color .2s, box-shadow .2s;
        }
        input[type="text"]::placeholder { color: var(--slate-500); }
        input[type="text"]:focus {
            outline: none;
            border-color: var(--sky);
            box-shadow: 0 0 0 3px rgba(14,165,233,.15);
        }

        /* Buttons */
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            background: linear-gradient(135deg, var(--sky), var(--purple));
            color: #fff; border: none; border-radius: 12px;
            padding: 13px 28px; font-size: .95rem; font-weight: 600;
            cursor: pointer; font-family: 'Inter', sans-serif;
            transition: transform .15s, box-shadow .15s, opacity .15s;
            margin-top: 12px;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(14,165,233,.25); }
        .btn:active { transform: translateY(0); }
        .btn:disabled { background: rgba(255,255,255,.08); color: var(--slate-500); cursor: not-allowed; transform: none; box-shadow: none; }
        .btn-secondary { background: rgba(255,255,255,.06); color: var(--slate-400); }
        .btn-secondary:hover { background: rgba(255,255,255,.1); color: #f1f5f9; box-shadow: none; }
        .btn-success { background: linear-gradient(135deg, var(--emerald), #059669); }

        /* Code blocks */
        .code-block {
            background: rgba(15, 23, 42, .5);
            border: 1px solid rgba(255,255,255,.06);
            border-left: 4px solid var(--sky);
            border-radius: 10px;
            padding: 14px 18px;
            font-family: 'JetBrains Mono', 'Consolas', monospace;
            font-size: .88rem; color: #e2e8f0;
            margin: 8px 0;
            cursor: pointer;
            transition: all .2s ease;
            user-select: none;
        }
        .code-block:hover {
            background: rgba(14, 165, 233, .06);
            border-left-color: var(--purple);
            transform: translateX(4px);
        }
        .code-block.selected {
            background: rgba(16, 185, 129, .08);
            border-left-color: var(--emerald);
            opacity: .5;
            transform: none;
        }

        /* Feedback */
        .error { color: var(--red); font-size: .9rem; margin-top: 8px; font-weight: 500; }
        .success { color: var(--emerald); font-size: .9rem; margin-top: 8px; font-weight: 500; }

        /* Progress bar */
        .progress-bar {
            width: 100%; height: 6px;
            background: rgba(255,255,255,.06);
            border-radius: 3px; margin: 20px 0; overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--sky), var(--purple));
            border-radius: 3px;
            transition: width .5s cubic-bezier(.4,0,.2,1);
        }

        /* Badges */
        .badge {
            display: inline-flex; align-items: center; gap: 4px;
            background: rgba(14,165,233,.1);
            color: var(--sky);
            padding: 5px 14px; border-radius: 20px;
            font-size: .78rem; font-weight: 600;
            margin-right: 6px; margin-bottom: 8px;
            border: 1px solid rgba(14,165,233,.15);
        }
        .badge-purple { background: rgba(139,92,246,.1); color: var(--purple); border-color: rgba(139,92,246,.15); }
        .badge-green { background: rgba(16,185,129,.1); color: var(--emerald); border-color: rgba(16,185,129,.15); }

        /* Question card */
        .question-card {
            background: rgba(15,23,42,.4);
            border: 1px solid rgba(255,255,255,.06);
            border-radius: 14px;
            padding: 24px; margin-top: 16px;
        }
        .question-card .q-label {
            font-size: .75rem; font-weight: 700;
            text-transform: uppercase; letter-spacing: .08em;
            color: var(--purple); margin-bottom: 10px;
        }
        .question-card .q-text {
            font-size: 1.05rem; font-weight: 600;
            color: #f1f5f9; margin-bottom: 16px; line-height: 1.5;
        }

        /* Arrange area */
        .arrange-drop {
            min-height: 70px;
            border: 2px dashed rgba(255,255,255,.08);
            border-radius: 14px;
            padding: 10px;
            margin: 12px 0;
            transition: border-color .2s;
        }
        .arrange-drop:has(.code-block) { border-color: rgba(16,185,129,.2); }

        /* Timer display */
        .timer {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.1rem; color: var(--purple); font-weight: 600;
        }

        /* Leaderboard table */
        .leaderboard-table { width: 100%; border-collapse: collapse; margin-top: 16px; }
        .leaderboard-table th {
            background: rgba(15,23,42,.4);
            color: var(--slate-400);
            font-size: .75rem; text-transform: uppercase; letter-spacing: .06em;
            padding: 12px 14px; text-align: left;
            border-bottom: 1px solid rgba(255,255,255,.06);
        }
        .leaderboard-table td {
            padding: 12px 14px;
            border-bottom: 1px solid rgba(255,255,255,.04);
            font-size: .9rem; color: var(--slate-200);
        }
        .leaderboard-table tr:hover td { background: rgba(255,255,255,.02); }
        .rank-1 { color: var(--amber); font-weight: 700; }
        .rank-2 { color: var(--slate-400); font-weight: 700; }
        .rank-3 { color: #cd7f32; font-weight: 700; }

        /* Celebration */
        .celebrate { text-align: center; }
        .celebrate .big-icon { font-size: 3.5rem; margin-bottom: 16px; display: block; }

        /* Section label */
        .section-label {
            font-size: .72rem; font-weight: 700;
            text-transform: uppercase; letter-spacing: .1em;
            color: var(--slate-500); margin: 20px 0 8px;
        }

        /* Responsive */
        @media (max-width: 500px) {
            .container { padding: 0 10px; margin: 16px auto; }
            .card { padding: 24px 18px; border-radius: 16px; }
            .header h1 { font-size: 1.1rem; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <span class="logo-icon">{ }</span>
            <h1>Jumbled Code Challenge</h1>
        </div>
        <div id="live-timer">00:00</div>
    </div>
    <div class="container">
        <div class="card" id="app"></div>
    </div>
    <script src="js/core.js"></script>
</body>
</html>
