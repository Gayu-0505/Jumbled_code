<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Rabbit Coders</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cyan: {
                            200: '#bae6fd',
                            300: '#7dd3fc',
                            400: '#0ea5e9',
                            500: '#0284c7',
                        },
                        purple: {
                            400: '#8b5cf6',
                            500: '#7c3aed',
                            600: '#6d28d9',
                        },
                        pink: {
                            500: '#ec4899',
                            600: '#db2777',
                        },
                    }
                }
            }
        }
    </script>
    <script src="/socket.io/socket.io.js"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@300;400;600;800&family=Space+Grotesk:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --c: #0ea5e9;
            --s: #8b5cf6;
            --a: #ec4899;
            --dk: #f7f8fc;
            --card: rgba(255, 255, 255, .8);
            --border: rgba(0, 0, 0, .08);
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Space Grotesk', 'Inter', sans-serif;
            background: var(--dk);
            color: #1e293b;
            overflow-x: hidden
        }

        .mono {
            font-family: 'JetBrains Mono', monospace
        }

        /* Background Effects */
        .bg-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background-image:
                radial-gradient(ellipse 80% 60% at 50% -20%, rgba(14, 165, 233, .06), transparent),
                radial-gradient(ellipse 60% 40% at 80% 50%, rgba(139, 92, 246, .04), transparent),
                linear-gradient(rgba(14, 165, 233, .04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(14, 165, 233, .04) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 60px 60px, 60px 60px;
        }

        .bg-grid::after {
            content: '';
            position: fixed;
            inset: 0;
            z-index: -1;
            background: radial-gradient(circle at 50% 120%, rgba(139, 92, 246, .06), transparent 60%);
            pointer-events: none;
        }

        /* Glass Morphism */
        .glass {
            background: rgba(255, 255, 255, .6);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(0, 0, 0, .06);
            box-shadow: 0 4px 24px rgba(0, 0, 0, .06), inset 0 1px 0 rgba(255, 255, 255, .8);
        }

        .glass-strong {
            background: rgba(255, 255, 255, .85);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(0, 0, 0, .08);
            box-shadow: 0 8px 32px rgba(0, 0, 0, .08), inset 0 1px 0 rgba(255, 255, 255, 1);
        }

        .code-blk {
            background: #f1f5f9;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 1rem;
            font-family: 'JetBrains Mono', monospace;
            position: relative;
            overflow: hidden
        }

        .code-blk::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--c), var(--s), var(--a))
        }

        /* Animations */
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(24px) }
            to { opacity: 1; transform: translateY(0) }
        }

        @keyframes fadeIn {
            from { opacity: 0 }
            to { opacity: 1 }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px) scale(.98) }
            to { opacity: 1; transform: translateY(0) scale(1) }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0) }
            20% { transform: translateX(-8px) }
            40% { transform: translateX(8px) }
            60% { transform: translateX(-5px) }
            80% { transform: translateX(5px) }
        }

        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 15px rgba(14, 165, 233, .2) }
            50% { box-shadow: 0 0 30px rgba(14, 165, 233, .35) }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) }
            50% { transform: translateY(-8px) }
        }

        @keyframes shimmer {
            0% { background-position: -200% center }
            100% { background-position: 200% center }
        }

        @keyframes borderGlow {
            0%, 100% { border-color: rgba(14, 165, 233, .2) }
            50% { border-color: rgba(14, 165, 233, .4) }
        }

        @keyframes confettiFall {
            0% { transform: translateY(-100vh) rotate(0deg); opacity: 1 }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0 }
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50% }
            50% { background-position: 100% 50% }
            100% { background-position: 0% 50% }
        }

        @keyframes typewriter {
            from { width: 0 }
            to { width: 100% }
        }

        .anim-slide { animation: slideUp .7s cubic-bezier(.22, 1, .36, 1) forwards }
        .anim-fade { animation: fadeIn .5s ease forwards }
        .anim-shake { animation: shake .5s ease-in-out }
        .anim-glow { animation: pulseGlow 2s infinite }
        .anim-float { animation: float 3s ease-in-out infinite }

        .gradient-text {
            background: linear-gradient(135deg, var(--c), var(--s), var(--a));
            background-size: 200% 200%;
            animation: gradientShift 4s ease infinite;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .shimmer-text {
            background: linear-gradient(90deg, #334155 40%, var(--c) 50%, #334155 60%);
            background-size: 200% auto;
            animation: shimmer 3s linear infinite;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Buttons */
        .btn-p {
            background: linear-gradient(135deg, var(--c), var(--s));
            color: #fff;
            font-weight: 700;
            border: none;
            transition: all .3s cubic-bezier(.22, 1, .36, 1);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .btn-p::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,.2), transparent);
            opacity: 0;
            transition: opacity .3s;
        }

        .btn-p:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(14, 165, 233, .3), 0 0 40px rgba(14, 165, 233, .1);
        }

        .btn-p:hover::before { opacity: 1 }

        .btn-p:active { transform: translateY(0); box-shadow: 0 4px 12px rgba(14, 165, 233, .15) }

        .btn-s {
            background: linear-gradient(135deg, #8b5cf6, #ec4899);
            color: #fff;
            cursor: pointer;
            transition: all .3s cubic-bezier(.22, 1, .36, 1);
        }

        .btn-s:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(139, 92, 246, .3);
        }

        /* Inputs */
        input, textarea, select {
            background: #fff;
            border: 1px solid #e2e8f0;
            color: #1e293b;
            padding: .8rem 1rem;
            border-radius: 12px;
            width: 100%;
            transition: all .3s cubic-bezier(.22, 1, .36, 1);
            font-family: inherit;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--c);
            box-shadow: 0 0 0 3px rgba(14, 165, 233, .1), 0 0 12px rgba(14, 165, 233, .05);
            background: #fff;
        }

        input::placeholder, textarea::placeholder {
            color: #94a3b8;
        }

        input[type=checkbox], input[type=radio] { width: auto }

        /* Game Elements */
        .set-indicator {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.1rem;
            transition: all .4s cubic-bezier(.22, 1, .36, 1)
        }

        .set-completed {
            background: linear-gradient(135deg, #0ea5e9, #8b5cf6);
            color: #fff;
            box-shadow: 0 0 16px rgba(14, 165, 233, .3), 0 0 32px rgba(14, 165, 233, .1)
        }

        .set-pending {
            background: #f1f5f9;
            color: #94a3b8;
            border: 2px dashed #e2e8f0
        }

        .set-current {
            background: rgba(14, 165, 233, .1);
            border: 3px solid var(--c);
            color: var(--c);
            animation: pulseGlow 2s infinite
        }

        .countdown-bar {
            height: 4px;
            background: linear-gradient(90deg, #0ea5e9, #8b5cf6, #ec4899);
            background-size: 200% 100%;
            animation: gradientShift 2s linear infinite;
            transition: width 1s linear
        }

        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            pointer-events: none;
            border-radius: 2px;
            animation: confettiFall 3s ease-out forwards
        }

        .part-badge {
            display: inline-flex;
            width: 30px;
            height: 30px;
            border-radius: 10px;
            background: linear-gradient(135deg, rgba(14, 165, 233, .1), rgba(139, 92, 246, .1));
            color: var(--c);
            font-size: .8rem;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(14, 165, 233, .15)
        }

        .fragment-part {
            background: rgba(14, 165, 233, .05);
            border: 1px solid rgba(14, 165, 233, .15);
            border-radius: 8px;
            padding: .5rem .75rem;
            margin: .25rem;
            display: inline-flex;
            align-items: center;
            transition: all .3s;
        }

        .fragment-part:hover {
            background: rgba(14, 165, 233, .1);
            border-color: rgba(14, 165, 233, .3);
            transform: translateY(-1px)
        }

        /* Admin Cards */
        .rs-card {
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            padding: 2rem 2.25rem;
            margin-bottom: 1.75rem;
            border-left: 4px solid var(--c);
            transition: all .3s cubic-bezier(.22, 1, .36, 1)
        }

        .rs-card:hover {
            border-color: rgba(14, 165, 233, .4);
            box-shadow: 0 8px 24px rgba(14, 165, 233, .08);
            transform: translateY(-1px)
        }

        .rs-sub {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 1.5rem 1.75rem;
            margin-top: 1rem;
            border-left: 3px solid var(--s);
            transition: all .3s cubic-bezier(.22, 1, .36, 1)
        }

        .rs-sub:hover {
            background: #f1f5f9;
            border-color: rgba(139, 92, 246, .3)
        }

        /* Leaderboard */
        .lb-row { transition: all .2s }
        .lb-row:hover { background: #f8fafc }
        .lb-gold { color: #d97706; text-shadow: none }
        .lb-silver { color: #64748b; text-shadow: none }
        .lb-bronze { color: #b45309; text-shadow: none }

        /* Tab Active */
        .tab-active {
            background: rgba(14, 165, 233, .08) !important;
            color: var(--c) !important;
            border-left: 3px solid var(--c);
            box-shadow: 0 0 12px rgba(14, 165, 233, .04);
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 5px }
        ::-webkit-scrollbar-track { background: transparent }
        ::-webkit-scrollbar-thumb { background: rgba(139, 92, 246, .25); border-radius: 3px }
        ::-webkit-scrollbar-thumb:hover { background: rgba(139, 92, 246, .4) }

        .live-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #22c55e;
            display: inline-block;
            box-shadow: 0 0 8px rgba(34, 197, 94, .6);
            animation: pulseGlow 2s infinite
        }

        /* Card hover lift */
        .card-hover {
            transition: all .3s cubic-bezier(.22, 1, .36, 1);
        }
        .card-hover:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 32px rgba(0, 0, 0, .1);
        }

        /* Stat card glow */
        .stat-card {
            position: relative;
            overflow: hidden;
        }
        .stat-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 1px;
            background: linear-gradient(135deg, rgba(14, 165, 233, .12), transparent, rgba(139, 92, 246, .12));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        /* Smooth transitions for sections */
        section { transition: opacity .4s ease }

        /* Toast notification */
        .toast-anim {
            animation: slideIn .4s cubic-bezier(.22, 1, .36, 1);
        }

        /* Assembly items */
        .assembly-item {
            transition: all .2s cubic-bezier(.22, 1, .36, 1);
        }
        .assembly-item:hover {
            background: #f1f5f9;
            border-color: rgba(14, 165, 233, .3);
        }

        /* Responsive fixes */
        @media (max-width: 768px) {
            .set-indicator { width: 40px; height: 40px; font-size: .9rem }
        }
    </style>
</head>

<body class="min-h-screen">
    <div class="bg-grid"></div>

    <!-- NAV -->
    <nav class="fixed top-0 w-full z-50 glass border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center space-x-3 cursor-pointer group" onclick="goHome()">
                    <div class="w-9 h-9 rounded-lg bg-gradient-to-br from-cyan-400 to-purple-600 flex items-center justify-center shadow-lg shadow-cyan-400/20 group-hover:shadow-cyan-400/40 transition-all">
                        <i class="fas fa-terminal text-white text-sm"></i>
                    </div>
                    <span id="nav-title" class="text-lg font-bold tracking-wider">
                        <span class="gradient-text">RABBIT</span><span class="text-gray-800">CODERS</span>
                    </span>
                </div>
                <div class="flex items-center space-x-3" id="nav-actions">
                    <button onclick="goHome()" class="text-gray-500 hover:text-cyan-400 text-sm transition-all hidden px-3 py-1.5 rounded-lg hover:bg-gray-100"
                        id="nav-home-btn"><i class="fas fa-home mr-1"></i> Home</button>
                    <div id="nav-user"
                        class="hidden items-center gap-2 px-3 py-1.5 rounded-lg bg-gray-100 border border-gray-200">
                        <div class="w-6 h-6 rounded-full bg-gradient-to-br from-cyan-400 to-purple-600 flex items-center justify-center">
                            <i class="fas fa-user text-white text-[10px]"></i>
                        </div>
                        <span id="nav-username" class="text-sm text-gray-700 font-medium"></span>
                    </div>
                    <button onclick="logout()" id="nav-logout"
                        class="hidden px-3 py-1.5 rounded-lg bg-red-50 border border-red-200 text-red-500 text-sm hover:bg-red-100 transition-all"><i
                            class="fas fa-sign-out-alt mr-1"></i> Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <main class="pt-20 pb-12 px-4 max-w-7xl mx-auto">

        <!-- LANDING -->
        <section id="s-landing" class="min-h-[85vh] flex flex-col items-center justify-center anim-slide">
            <div class="glass-strong rounded-3xl p-8 md:p-14 max-w-3xl w-full text-center relative overflow-hidden">
                <!-- Decorative orbs -->
                <div class="absolute -top-20 -right-20 w-48 h-48 bg-cyan-400/10 rounded-full blur-3xl pointer-events-none"></div>
                <div class="absolute -bottom-16 -left-16 w-40 h-40 bg-purple-600/10 rounded-full blur-3xl pointer-events-none"></div>
                <div class="relative z-10">
                    <div class="mb-10">
                        <div class="w-24 h-24 mx-auto bg-gradient-to-br from-cyan-400 via-purple-500 to-pink-500 rounded-2xl flex items-center justify-center mb-8 shadow-2xl shadow-cyan-400/20 anim-float rotate-3">
                            <i class="fas fa-puzzle-piece text-4xl text-white drop-shadow-lg"></i>
                        </div>
                        <h1 id="landing-event-name" class="text-4xl md:text-6xl font-bold mb-5 gradient-text leading-tight">
                            Rabbit Coders</h1>
                        <p class="text-gray-500 text-lg md:text-xl max-w-xl mx-auto leading-relaxed">Solve riddles <span class="text-cyan-400/80">&middot;</span> Collect code parts <span class="text-purple-400/80">&middot;</span> Arrange the sequence</p>
                    </div>
                    <div class="mb-10">
                        <button onclick="showSec('s-p-entry')"
                            class="group w-full p-7 rounded-2xl bg-gradient-to-br from-cyan-400/5 to-purple-600/5 border border-gray-200 hover:border-cyan-400/60 transition-all card-hover text-center">
                            <div class="w-14 h-14 mx-auto rounded-xl bg-gradient-to-br from-cyan-400/15 to-cyan-400/5 flex items-center justify-center mb-4 group-hover:scale-110 transition-transform">
                                <i class="fas fa-rocket text-2xl text-cyan-400"></i>
                            </div>
                            <h3 class="text-xl font-bold text-gray-800 mb-1.5">Start Challenge</h3>
                            <p class="text-sm text-gray-500">Enter your team details and begin solving</p>
                        </button>
                    </div>
                    <div class="flex justify-center gap-8 text-xs text-gray-500">
                        <span class="flex items-center gap-1.5"><div class="w-5 h-5 rounded bg-cyan-400/10 flex items-center justify-center"><i class="fas fa-layer-group text-cyan-400 text-[9px]"></i></div> Multiple Codes</span>
                        <span class="flex items-center gap-1.5"><div class="w-5 h-5 rounded bg-purple-400/10 flex items-center justify-center"><i class="fas fa-puzzle-piece text-purple-400 text-[9px]"></i></div> Part Collection</span>
                        <span class="flex items-center gap-1.5"><div class="w-5 h-5 rounded bg-yellow-400/10 flex items-center justify-center"><i class="fas fa-trophy text-yellow-400 text-[9px]"></i></div> Leaderboard</span>
                    </div>
                </div>
            </div>
            <!-- Admin link – small card below main panel -->
            <div onclick="showSec('s-admin-login')" class="mt-4 mx-auto max-w-xs w-full cursor-pointer rounded-xl bg-white/60 border border-gray-200 hover:border-purple-400/40 px-5 py-3 flex items-center justify-center gap-2.5 transition-all hover:bg-white/80">
                <i class="fas fa-shield-halved text-purple-400/60 text-sm"></i>
                <span class="text-xs text-gray-500 hover:text-gray-700 transition-colors">Admin Portal</span>
            </div>
        </section>

        <!-- PARTICIPANT ENTRY -->
        <section id="s-p-entry" class="hidden min-h-[80vh] flex items-center justify-center">
            <div class="glass-strong rounded-3xl p-10 md:p-14 max-w-lg w-full anim-slide relative overflow-hidden">
                <div class="absolute -top-16 -right-16 w-32 h-32 bg-cyan-400/8 rounded-full blur-3xl pointer-events-none"></div>
                <div class="relative z-10">
                    <div class="text-center mb-10">
                        <div class="w-18 h-18 mx-auto w-[4.5rem] h-[4.5rem] bg-gradient-to-br from-cyan-400 to-purple-600 rounded-2xl flex items-center justify-center mb-5 shadow-xl shadow-cyan-400/15">
                            <i class="fas fa-users text-2xl text-white"></i>
                        </div>
                        <h2 class="text-3xl font-bold text-gray-800">Enter Your Details</h2>
                        <p class="text-sm text-gray-500 mt-2.5">Fill in your team info to start the challenge</p>
                    </div>
                    <div class="space-y-6">
                        <div>
                            <label class="block text-xs font-semibold text-gray-500 mb-2.5 uppercase tracking-wider">Team Name <span class="text-red-500">*</span></label>
                            <input type="text" id="e-team" placeholder="Enter your team name" class="py-3.5">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-500 mb-2.5 uppercase tracking-wider">Year <span class="text-red-500">*</span></label>
                            <select id="e-year" class="py-3.5">
                                <option value="">Select year</option>
                                <option value="1">1st Year</option>
                                <option value="2">2nd Year</option>
                                <option value="3">3rd Year</option>
                                <option value="4">4th Year</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-500 mb-2.5 uppercase tracking-wider">Department <span class="text-red-500">*</span></label>
                            <input type="text" id="e-dept" placeholder="e.g. Computer Science" class="py-3.5">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-500 mb-2.5 uppercase tracking-wider">College Name <span class="text-red-500">*</span></label>
                            <input type="text" id="e-college" placeholder="Enter your college name" class="py-3.5">
                        </div>
                        <div class="pt-2">
                            <button onclick="enterChallenge()" class="btn-p w-full py-4 rounded-xl text-base font-bold"><i class="fas fa-play mr-2"></i> Start Challenge</button>
                        </div>
                        <div id="e-err" class="hidden p-3 rounded-xl bg-red-50 border border-red-200 text-red-500 text-sm text-center"></div>
                        <button onclick="showSec('s-landing')" class="w-full text-xs text-gray-500 hover:text-gray-700 py-1 transition-colors">← Back to Home</button>
                    </div>
                </div>
            </div>
        </section>

        <!-- ADMIN LOGIN -->
        <section id="s-admin-login" class="hidden min-h-[80vh] flex items-center justify-center">
            <div class="glass-strong rounded-3xl p-8 md:p-10 max-w-md w-full anim-slide relative overflow-hidden">
                <div class="absolute -top-16 -left-16 w-32 h-32 bg-purple-500/8 rounded-full blur-3xl pointer-events-none"></div>
                <div class="relative z-10">
                    <div class="text-center mb-8">
                        <div class="w-16 h-16 mx-auto bg-gradient-to-br from-purple-500 to-pink-600 rounded-2xl flex items-center justify-center mb-5 shadow-xl shadow-purple-500/15">
                            <i class="fas fa-shield-halved text-2xl text-white"></i>
                        </div>
                        <h2 class="text-2xl font-bold text-gray-800">Admin Portal</h2>
                        <p class="text-sm text-gray-500 mt-2">Secure access — authorised personnel only</p>
                    </div>
                    <div class="space-y-5">
                        <div><label class="block text-xs font-semibold text-gray-500 mb-2 uppercase tracking-wider">Admin Username</label><input type="text" id="a-login-user" placeholder="Admin username"></div>
